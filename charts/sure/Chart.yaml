apiVersion: v2
name: sure
description: Official Helm chart for deploying the Sure Rails app (web + Sidekiq) on Kubernetes with optional HA PostgreSQL (CloudNativePG) and Redis.
type: application
version: 0.7.5-alpha.12
appVersion: "0.7.5-alpha.12"

kubeVersion: ">=1.25.0-0"

home: https://github.com/we-promise/sure
sources:
  - https://github.com/we-promise/sure
keywords:
  - rails
  - sidekiq
  - personal-finance
  - cloudnativepg
  - redis
maintainers:
  - name: Sure maintainers
    url: https://github.com/we-promise/sure

# Optional subcharts for turnkey self-hosting
# cloudnative-pg is pulled from its OCI registry and needs no `helm repo add`;
# redis-operator's repository must be added before building dependencies.
dependencies:
  - name: cloudnative-pg
    version: "~0.27"
    repository: "oci://ghcr.io/cloudnative-pg/charts"
    condition: cnpg.enabled
  - name: redis-operator
    alias: redisOperator
    version: "~0.23.0"
    repository: "https://ot-container-kit.github.io/helm-charts"
    condition: redisOperator.enabled
