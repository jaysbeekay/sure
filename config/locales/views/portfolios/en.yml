      twr: Time-weighted return
      twr_hint: What the investments did, with the effect of your contributions removed. Daily, net of fees, with each contribution counted from the start of its day.
      volatility: Volatility
      volatility_hint: Annualised standard deviation of daily returns, over calendar days rather than trading days.
