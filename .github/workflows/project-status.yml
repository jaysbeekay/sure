name: Project status

# Moves cards on the project board through the delivery sequence:
#   @codebot request or Gatekeeper QA review  -> Issue review
#   reply citing a READY QA review            -> Ready to build
#   draft PR naming "Closes/Part of #N"       -> In progress (PR and issue)
#   PR marked ready                           -> In review
#   pre-flight naming its upstream PR         -> Upstream
# Moves are forward-only, and a card at Blocked (or any status this script
# never sets) is held there. Done, closed and reopened are left to the board's
# built-in workflows. "Run workflow" sets any status by hand, which is how a
# Claude session moves a card.
#
# PR moves come from pull_request (same-repository PRs whose head carries this
# file) and from an hourly sweep of every open PR, which covers pre-flights,
# PRs with a merge conflict and PRs from forks. pull_request_target is not
# used: GitHub blocks it by default in public repositories from 2026-12-02.
#
# Inert until secrets.PROJECT_TOKEN and vars.PROJECT_NUMBER are set. It never
# comments, labels or pushes, and never checks out pull request code.
# See docs/project-status.md.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, ready_for_review]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or PR number'
        required: true
      status:
        description: 'Status to set'
        required: true
        type: choice
        options: ['Triage', 'Issue review', 'Ready to build', 'In progress', 'In review', 'Upstream', 'Done']

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  move:
    # PRs from forks and Dependabot get no PROJECT_TOKEN, so their runs are
    # skipped rather than shown green with nothing moved; the sweep moves them.
    if: >-
      github.repository == 'jaysbeekay/sure' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    # The sweep makes about three calls per open PR and issue it names.
    timeout-minutes: 15
    steps:
      - name: Check out the script from the default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/project-status

      - name: Move cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GATEKEEPER_LOGINS: ${{ vars.GATEKEEPER_LOGINS }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_STATUS: ${{ inputs.status }}
        run: node .github/project-status/main.mjs ${{ github.event_name == 'schedule' && '--sweep' || '' }}
