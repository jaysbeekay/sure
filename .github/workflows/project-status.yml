name: Project status

# Moves cards on the project board through the delivery sequence:
#   @codebot request or Gatekeeper QA review  -> Issue review
#   reply citing a READY QA review            -> Ready to build
#   draft PR naming "Closes/Part of #N"       -> In progress (PR and issue)
#   PR marked ready                           -> In review
#   pre-flight naming its upstream PR         -> Upstream
# Moves are forward-only. Done, closed and reopened are left to the board's
# built-in workflows. "Run workflow" sets any status by hand, which is how a
# Claude session moves a card.
#
# Inert until secrets.PROJECT_TOKEN and vars.PROJECT_NUMBER are set. It never
# comments, labels or pushes, and never checks out pull request code.
# See docs/project-status.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or PR number'
        required: true
      status:
        description: 'Status to set'
        required: true
        type: choice
        options: ['Triage', 'Issue review', 'Ready to build', 'In progress', 'In review', 'Upstream', 'Done']

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  move:
    if: github.repository == 'jaysbeekay/sure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the script from the default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/project-status

      - name: Move cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GATEKEEPER_LOGINS: ${{ vars.GATEKEEPER_LOGINS }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_STATUS: ${{ inputs.status }}
        run: node .github/project-status/main.mjs
