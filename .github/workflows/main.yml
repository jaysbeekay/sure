name: CodeBot

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: codebot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codebot:

    if: >
      startsWith(github.event.comment.body, '@codebot') &&
      github.event.comment.user.login == 'jaysbeekay' &&
      github.event.comment.author_association == 'OWNER'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Log trigger
        run: |
          echo "Triggered by: ${{ github.event.comment.user.login }}"
          echo "Repo: ${{ github.repository }}"
          echo "Issue/PR: ${{ github.event.issue.number }}"

      - name: Build curated payload
        id: payload
        run: |
          COMMENT_BODY=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          # Strip the "@codebot" trigger word, leave the actual instruction
          COMMAND=$(echo "$COMMENT_BODY" | sed -E 's/^@codebot[[:space:]]*//')

          # printf (not `> payload.json`) so no trailing newline is added —
          # the signing step must hash the exact bytes curl will send.
          printf '%s' "$(jq -cn \
            --arg event "codebot_trigger" \
            --arg repo "${{ github.repository }}" \
            --argjson issue_number "${{ github.event.issue.number }}" \
            --argjson comment_id "${{ github.event.comment.id }}" \
            --arg comment_url "${{ github.event.comment.html_url }}" \
            --arg author "${{ github.event.comment.user.login }}" \
            --arg author_association "${{ github.event.comment.author_association }}" \
            --arg command "$COMMAND" \
            --arg triggered_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event: $event,
              repository: $repo,
              issue_number: $issue_number,
              comment: {
                id: $comment_id,
                url: $comment_url,
                author: $author,
                author_association: $author_association,
                command: $command
              },
              triggered_at: $triggered_at
            }')" > payload.json

          echo "Payload built:"
          cat payload.json

      - name: Sign and send curated event to Hermes
        env:
          CODEBOT_SECRET: ${{ secrets.CODEBOT_SECRET }}
        run: |
          # payload.json was written with printf (no trailing newline) so the
          # bytes we hash below are byte-for-byte identical to what curl sends.
          TIMESTAMP=$(date +%s)
          BODY=$(cat payload.json)
          SIGNATURE=$(printf '%s.%s' "$TIMESTAMP" "$BODY" \
            | openssl dgst -sha256 -hmac "$CODEBOT_SECRET" -r \
            | awk '{print $1}')

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature-V2: $SIGNATURE" \
            -H "X-Webhook-Timestamp: $TIMESTAMP" \
            -H "X-Request-ID: codebot-${{ github.event.comment.id }}" \
            --data-binary @payload.json \
            "${{ secrets.AI_WEBHOOK_URL }}"
